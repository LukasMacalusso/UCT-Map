name: Backend CI

on:
  push:
    branches: [ "main", "taller-2" ]
    paths:
      - 'src/backend/**'
      - 'tests/postman/**'
      - 'docker-compose.yml'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main", "taller-2" ]

  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify Code Formatting
        run: |
          dotnet format src/backend/Services/Campus/Campus.slnx --verify-no-changes
          dotnet format src/backend/Services/Identity/Identity.slnx --verify-no-changes
          dotnet format src/backend/Services/Incident/Incident.slnx --verify-no-changes
          dotnet format src/backend/Services/Schedule/Schedule.slnx --verify-no-changes

      - name: Build All Microservices
        run: |
          dotnet build src/backend/Services/Campus/Campus.slnx -c Release
          dotnet build src/backend/Services/Identity/Identity.slnx -c Release
          dotnet build src/backend/Services/Incident/Incident.slnx -c Release
          dotnet build src/backend/Services/Schedule/Schedule.slnx -c Release

      - name: Run Unit and Integration Tests
        run: |
          dotnet test src/backend/Services/Campus/Campus.slnx -c Release --no-build --collect:"XPlat Code Coverage"
          dotnet test src/backend/Services/Identity/Identity.slnx -c Release --no-build --collect:"XPlat Code Coverage"
          dotnet test src/backend/Services/Incident/Incident.slnx -c Release --no-build --collect:"XPlat Code Coverage"
          dotnet test src/backend/Services/Schedule/Schedule.slnx -c Release --no-build --collect:"XPlat Code Coverage"

      - name: Code Coverage Summary Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: '**/coverage.cobertura.xml'
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '75 90'

  e2e-gateway-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Start Backend and API Gateway Containers
        run: |
          docker compose up -d --build postgres mongodb identity-api campus-api incident-api schedule-api api-gateway

      - name: Wait for API Gateway and Seed E2E User
        run: |
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/campus/campuses || true)
            if [ "$STATUS" = "401" ]; then
              echo "API Gateway is up and enforcing auth!"
              break
            fi
            echo "Waiting for API Gateway... ($i/30)"
            sleep 2
          done

          for i in {1..30}; do
            REG_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:5000/api/identity/register \
              -H "Content-Type: application/json" \
              -d '{"name":"E2E Test User","email":"e2e_test@uct.cl","password":"Password123!"}' || true)
            if [ "$REG_STATUS" = "201" ] || [ "$REG_STATUS" = "400" ]; then
              echo "Identity service is ready and E2E user is seeded ($REG_STATUS)!"
              break
            fi
            echo "Waiting for Identity Service migrations... ($i/30)"
            sleep 2
          done

      - name: Run Newman E2E Tests
        run: make test-e2e

      - name: Dump Docker Logs on Failure
        if: failure()
        run: docker compose logs

      - name: Stop and Clean Containers
        if: always()
        run: docker compose down -v

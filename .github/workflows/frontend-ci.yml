name: Frontend CI

on:
  push:
    branches: [ "main", "taller-2", "taller-4", "ti2", "ti4" ]
    paths:
      - 'src/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ "main", "taller-2", "taller-4", "ti2", "ti4" ]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Frontend Directory
        id: check-frontend
        run: |
          if [ -d "src/frontend" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Directorio src/frontend detectado. Procediendo con verificación de frontend web."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Directorio src/frontend no presente en esta rama. Omitiendo verificación de frontend."
          fi

      - name: Setup Node.js 22.x
        if: steps.check-frontend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: 'src/frontend/package-lock.json'

      - name: Install Dependencies
        if: steps.check-frontend.outputs.exists == 'true'
        working-directory: ./src/frontend
        run: npm ci

      - name: Verify Code Quality
        if: steps.check-frontend.outputs.exists == 'true'
        working-directory: ./src/frontend
        run: npm run lint
        continue-on-error: true

      - name: Run Unit Tests & Generate Coverage
        if: steps.check-frontend.outputs.exists == 'true'
        working-directory: ./src/frontend
        run: npm run coverage

      - name: Type Check and Build
        if: steps.check-frontend.outputs.exists == 'true'
        working-directory: ./src/frontend
        run: npm run build

      - name: Code Coverage Summary Report
        if: steps.check-frontend.outputs.exists == 'true'
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: 'src/frontend/coverage/cobertura-coverage.xml'
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both

name: Flutter CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/mobile/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/mobile/**'
      - '.github/workflows/flutter-ci.yml'
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-analyze:
    name: Code Analysis & Linter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Prepare Environment (.env)
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true

      - name: Run Static Analysis
        run: flutter analyze --no-fatal-infos

  unit-tests:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Prepare Environment (.env)
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests with Coverage
        run: flutter test --coverage

      - name: Generate JaCoCo XML Coverage Report & Verify 90% Threshold
        if: always()
        run: dart run tool/generate_jacoco_report.dart

      - name: Upload JaCoCo & LCOV Coverage to Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: |
            src/mobile/coverage/jacoco.xml
            src/mobile/coverage/lcov.info
          if-no-files-found: ignore

      - name: Generate Code Coverage Summary
        if: always()
        run: |
          if [ -f coverage/lcov.info ]; then
            awk -F':' '
              /^LF:/ { lf += $2 }
              /^LH:/ { lh += $2 }
              END {
                if (lf > 0) {
                  pct = (lh / lf) * 100
                  target = 90.0
                  status = (pct >= target) ? "Cumplido (>= 90%)" : "En progreso (< 90%)"
                  print "### Reporte de Cobertura JaCoCo (TI4-94)" >> ENVIRON["GITHUB_STEP_SUMMARY"]
                  print "" >> ENVIRON["GITHUB_STEP_SUMMARY"]
                  print "| Metrica | Valor |" >> ENVIRON["GITHUB_STEP_SUMMARY"]
                  print "|---|---|" >> ENVIRON["GITHUB_STEP_SUMMARY"]
                  printf "| **Lineas evaluadas** | %d |\n", lf >> ENVIRON["GITHUB_STEP_SUMMARY"]
                  printf "| **Lineas cubiertas** | %d |\n", lh >> ENVIRON["GITHUB_STEP_SUMMARY"]
                  printf "| **Porcentaje actual** | **%.2f%%** |\n", pct >> ENVIRON["GITHUB_STEP_SUMMARY"]
                  printf "| **Umbral objetivo** | **%.2f%%** |\n", target >> ENVIRON["GITHUB_STEP_SUMMARY"]
                  printf "| **Estado JaCoCo** | %s |\n", status >> ENVIRON["GITHUB_STEP_SUMMARY"]
                }
              }
            ' coverage/lcov.info
          fi

  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Prepare Environment (.env)
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release-build
          path: src/mobile/build/web

  build-android:
    name: Build Android APK (Debug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Prepare Environment (.env)
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Upload Android APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: src/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: ignore

  integration-tests:
    name: Mobile Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Prepare Environment (.env)
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev xvfb
          flutter config --enable-linux-desktop

      - name: Run Mobile Integration Tests
        run: xvfb-run -a flutter test integration_test/app_integration_test.dart -d linux

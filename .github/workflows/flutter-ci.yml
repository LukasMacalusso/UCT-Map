name: Flutter CI

on:
  push:
    branches:
      - main
      - taller-4
      - taller-2
      - ti4
      - ti2
    paths:
      - 'uct_map/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches:
      - main
      - taller-4
      - taller-2
      - ti4
      - ti2
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-analyze:
    name: Code Analysis & Linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Flutter Directory
        id: check-flutter
        run: |
          if [ -d "uct_map" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Directorio uct_map detectado. Procediendo con análisis estático."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Directorio uct_map no presente en esta rama. Omitiendo análisis de Flutter."
          fi

      - name: Setup Flutter
        if: steps.check-flutter.outputs.exists == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Prepare Environment (.env)
        if: steps.check-flutter.outputs.exists == 'true'
        working-directory: ./uct_map
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Install Dependencies
        if: steps.check-flutter.outputs.exists == 'true'
        working-directory: ./uct_map
        run: flutter pub get

      - name: Verify Code Formatting
        if: steps.check-flutter.outputs.exists == 'true'
        working-directory: ./uct_map
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true # Permite reporte de linter sin bloquear mientras se estandariza el formato

      - name: Run Static Analysis
        if: steps.check-flutter.outputs.exists == 'true'
        working-directory: ./uct_map
        run: flutter analyze --no-fatal-infos

  unit-tests:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Flutter Directory
        id: check-flutter
        run: |
          if [ -d "uct_map" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Directorio uct_map detectado. Procediendo con pruebas unitarias y de widgets."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Directorio uct_map no presente en esta rama. Omitiendo pruebas unitarias de Flutter."
          fi

      - name: Setup Flutter
        if: steps.check-flutter.outputs.exists == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Prepare Environment (.env)
        if: steps.check-flutter.outputs.exists == 'true'
        working-directory: ./uct_map
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Install Dependencies
        if: steps.check-flutter.outputs.exists == 'true'
        working-directory: ./uct_map
        run: flutter pub get

      - name: Run Tests with Coverage
        if: steps.check-flutter.outputs.exists == 'true'
        working-directory: ./uct_map
        run: flutter test --coverage

      - name: Generate JaCoCo XML Coverage Report & Verify 90% Threshold
        if: always() && steps.check-flutter.outputs.exists == 'true'
        working-directory: ./uct_map
        run: dart run tool/generate_jacoco_report.dart

      - name: Upload JaCoCo & LCOV Coverage to Artifacts
        if: always() && steps.check-flutter.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: |
            uct_map/coverage/jacoco.xml
            uct_map/coverage/lcov.info
          if-no-files-found: ignore

      - name: Generate Code Coverage Summary
        if: always() && steps.check-flutter.outputs.exists == 'true'
        working-directory: ./uct_map
        run: |
          if [ -f coverage/lcov.info ]; then
            awk -F':' '
              /^LF:/ { lf += $2 }
              /^LH:/ { lh += $2 }
              END {
                if (lf > 0) {
                  pct = (lh / lf) * 100
                  target = 90.0
                  status = (pct >= target) ? "✅ Cumplido (>= 90%)" : "⚠️ En progreso (< 90%)"
                  print "### 📊 Reporte de Cobertura JaCoCo (TI4-94)" >> ENVIRON["GITHUB_STEP_SUMMARY"]
                  print "" >> ENVIRON["GITHUB_STEP_SUMMARY"]
                  print "| Métrica | Valor |" >> ENVIRON["GITHUB_STEP_SUMMARY"]
                  print "|---|---|" >> ENVIRON["GITHUB_STEP_SUMMARY"]
                  printf "| **Líneas evaluadas** | %d |\n", lf >> ENVIRON["GITHUB_STEP_SUMMARY"]
                  printf "| **Líneas cubiertas** | %d |\n", lh >> ENVIRON["GITHUB_STEP_SUMMARY"]
                  printf "| **Porcentaje actual** | **%.2f%%** |\n", pct >> ENVIRON["GITHUB_STEP_SUMMARY"]
                  printf "| **Umbral objetivo** | **%.2f%%** |\n", target >> ENVIRON["GITHUB_STEP_SUMMARY"]
                  printf "| **Estado JaCoCo** | %s |\n", status >> ENVIRON["GITHUB_STEP_SUMMARY"]
                }
              }
            ' coverage/lcov.info
          fi

  build-web:
    name: Build Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Flutter Directory
        id: check-flutter
        run: |
          if [ -d "uct_map" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Directorio uct_map detectado. Procediendo con compilación web."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Directorio uct_map no presente en esta rama. Omitiendo compilación web de Flutter."
          fi

      - name: Setup Flutter
        if: steps.check-flutter.outputs.exists == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Prepare Environment (.env)
        if: steps.check-flutter.outputs.exists == 'true'
        working-directory: ./uct_map
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Install Dependencies
        if: steps.check-flutter.outputs.exists == 'true'
        working-directory: ./uct_map
        run: flutter pub get

      - name: Build Web
        if: steps.check-flutter.outputs.exists == 'true'
        working-directory: ./uct_map
        run: flutter build web --release

      - name: Upload Web Build Artifact
        if: steps.check-flutter.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web-release-build
          path: uct_map/build/web

  build-android:
    name: Build Android APK (Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Flutter Directory
        id: check-flutter
        run: |
          if [ -d "uct_map" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Directorio uct_map detectado. Procediendo con compilación Android."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Directorio uct_map no presente en esta rama. Omitiendo compilación Android de Flutter."
          fi

      - name: Setup Java 17
        if: steps.check-flutter.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        if: steps.check-flutter.outputs.exists == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Prepare Environment (.env)
        if: steps.check-flutter.outputs.exists == 'true'
        working-directory: ./uct_map
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Install Dependencies
        if: steps.check-flutter.outputs.exists == 'true'
        working-directory: ./uct_map
        run: flutter pub get

      - name: Build Android Debug APK
        if: steps.check-flutter.outputs.exists == 'true'
        working-directory: ./uct_map
        run: flutter build apk --debug

      - name: Upload Android APK Artifact
        if: success() && steps.check-flutter.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: uct_map/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: ignore

  integration-tests:
    name: Mobile Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Flutter Directory
        id: check-flutter
        run: |
          if [ -d "uct_map" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Directorio uct_map detectado. Procediendo con pruebas de integración móvil."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Directorio uct_map no presente en esta rama. Omitiendo pruebas de integración móvil."
          fi

      - name: Setup Flutter
        if: steps.check-flutter.outputs.exists == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Prepare Environment (.env)
        if: steps.check-flutter.outputs.exists == 'true'
        working-directory: ./uct_map
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Install Dependencies
        if: steps.check-flutter.outputs.exists == 'true'
        working-directory: ./uct_map
        run: flutter pub get

      - name: Install Linux build dependencies
        if: steps.check-flutter.outputs.exists == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev xvfb
          flutter config --enable-linux-desktop

      - name: Run Mobile Integration Tests
        if: steps.check-flutter.outputs.exists == 'true'
        working-directory: ./uct_map
        run: xvfb-run -a flutter test integration_test/app_integration_test.dart -d linux

<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<title>Regreso a UCT Map</title>
<p>Regresando a UCT Map… Puedes cerrar esta ventana.</p>
<script>
  const callback = window.location.href;
  // Remove the authorization code from the visible URL and browser history.
  history.replaceState(null, '', window.location.pathname);
  if (window.opener) {
    window.opener.postMessage({'flutter-web-auth-2': callback}, window.location.origin);
    window.close();
  }
</script>
</html>

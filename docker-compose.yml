name: uct-map

x-jwt-env: &jwt-env
  JwtConfig__Key: "${UCT_JWT_KEY:?Define UCT_JWT_KEY in .env}"
  JwtConfig__Issuer: "${UCT_JWT_ISSUER:-https://identity-api}"
  JwtConfig__Audience: "${UCT_JWT_AUDIENCE:-api-gateway}"
  JwtConfig__TokenValidationMins: "${UCT_JWT_EXPIRATION_MINS:-30}"

services:
  # ===========================================================================
  # Databases
  # ===========================================================================
  postgres:
    image: postgres:17-alpine
    container_name: uct_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-root}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    networks:
      - uct_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-root} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 15

  mongodb:
    image: mongo:7
    container_name: uct_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_USER:-root}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD:?Define MONGO_PASSWORD in .env}"
    volumes:
      - mongodb_data:/data/db
    networks:
      - uct_network
    healthcheck:
      test:
        - CMD-SHELL
        - "mongosh --quiet -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok' | grep 1"
      interval: 10s
      timeout: 5s
      retries: 15

  # ===========================================================================
  # Backend Microservices (.NET 10 )
  # ===========================================================================
  identity-api:
    build:
      context: .
      dockerfile: src/backend/Services/Identity/Dockerfile
    container_name: uct_identity_api
    restart: unless-stopped
    environment:
      <<: *jwt-env
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__IdentityDb: "Host=postgres;Port=5432;Database=uct_identity_db;Username=${POSTGRES_USER:-root};Password=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - uct_network

  campus-api:
    build:
      context: .
      dockerfile: src/backend/Services/Campus/Dockerfile
    container_name: uct_campus_api
    restart: unless-stopped
    environment:
      <<: *jwt-env
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__CampusDb: "Host=postgres;Port=5432;Database=uct_campus_db;Username=${POSTGRES_USER:-root};Password=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - uct_network

  incident-api:
    build:
      context: .
      dockerfile: src/backend/Services/Incident/Dockerfile
    container_name: uct_incident_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ASPNETCORE_HTTP_PORTS: "8080"
      MongoDB__ConnectionString: "mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD:?Define MONGO_PASSWORD in .env}@mongodb:27017/?authSource=admin"
      MongoDB__DatabaseName: "uct_incident_db"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - uct_network

  schedule-api:
    build:
      context: .
      dockerfile: src/backend/Services/Schedule/Dockerfile
    container_name: uct_schedule_api
    restart: unless-stopped
    environment:
      <<: *jwt-env
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__ScheduleDb: "Host=postgres;Port=5432;Database=uct_schedule_db;Username=${POSTGRES_USER:-root};Password=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - uct_network

  # ===========================================================================
  # API Gateway & Web Frontend
  # ===========================================================================
  api-gateway:
    build:
      context: .
      dockerfile: src/backend/ApiGateway/Dockerfile
    container_name: uct_api_gateway
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      <<: *jwt-env
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ASPNETCORE_HTTP_PORTS: "8080"
      ReverseProxy__Clusters__IdentityCluster__Destinations__identity-node-1__Address: "http://identity-api:8080"
      ReverseProxy__Clusters__CampusCluster__Destinations__campus-node-1__Address: "http://campus-api:8080"
      ReverseProxy__Clusters__IncidentCluster__Destinations__incident-node-1__Address: "http://incident-api:8080"
      ReverseProxy__Clusters__ScheduleCluster__Destinations__schedule-node-1__Address: "http://schedule-api:8080"
    depends_on:
      - identity-api
      - campus-api
      - incident-api
      - schedule-api
    networks:
      - uct_network

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: uct_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - uct_network

networks:
  uct_network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
